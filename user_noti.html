<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Notifications</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/user_noti.css">
</head>

<body>

<div class="profile-page">

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">

        <!-- USER HEADER -->
        <div class="user-header">
            <div class="water-logo">
                <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
                    <path d="M30 3 C30 3 8 29 8 43 C8 57 18 66 30 66 C42 66 52 57 52 43 C52 29 30 3 30 3Z" fill="#179ED5"/>
                    <path d="M30 12 C30 12 15 32 15 43 C15 53 21 59 30 59 C39 59 45 53 45 43 C45 32 30 12 30 12Z" fill="white"/>
                    <path d="M30 20 C30 20 20 35 20 43 C20 49 24 53 30 53 C36 53 40 49 40 43 C40 35 30 20 30 20Z" fill="#179ED5"/>
                </svg>
            </div>

            <div class="user-details">
                <div class="user-name">User</div>
                <button type="button" class="view-profile-btn" id="viewProfileBtn">View Profile</button>
            </div>
        </div>

        <!-- SIDEBAR MENU -->
        <div class="sidebar-menu">
            <button type="button" class="sidebar-item" id="profileBtn">
                <span>My Profile</span>
            </button>

            <button type="button" class="sidebar-item" id="passwordBtn">
                <span>Password</span>
            </button>

            <button type="button" class="sidebar-item selected" id="notificationBtn">
                <span>Notifications</span>
                <span class="right-arrow">▶</span>
            </button>

            <button type="button" class="sidebar-item" id="orderBtn">
                <span>My Order</span>
            </button>

            <button type="button" class="sidebar-item" id="deliveryBtn">
                <span>Delivery History</span>
            </button>

            <button type="button" class="back-button" id="backBtn">
                Back
            </button>
        </div>

    </div>

    <!-- RIGHT CONTENT -->
    <div class="content">
        <div id="notificationContent" class="notification-content">
            <div class="notification-card">

                <!-- NORMAL NOTIFICATIONS -->
                <div class="notification-section">
                    <h2 class="notification-title">Notifications</h2>

                    <div class="notification-row">
                        <span class="notification-label">Order Confirmed</span>
                        <label class="toggle">
                            <input type="checkbox" id="orderConfirmed">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="notification-row">
                        <span class="notification-label">Order Cancelled</span>
                        <label class="toggle">
                            <input type="checkbox" id="orderCancelled">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="notification-row">
                        <span class="notification-label">Payment successful</span>
                        <label class="toggle">
                            <input type="checkbox" id="paymentSuccessful">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

                <div class="notification-divider"></div>

                <!-- SYSTEM NOTIFICATIONS -->
                <div class="notification-section system-section">
                    <h2 class="notification-title">System Notifications</h2>

                    <div class="notification-row">
                        <span class="notification-label">System maintenance update</span>
                        <label class="toggle">
                            <input type="checkbox" id="systemMaintenance">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>

                    <div class="notification-row">
                        <span class="notification-label">Account login from new device</span>
                        <label class="toggle">
                            <input type="checkbox" id="newDeviceLogin">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

<!-- Bootstrap JS & Custom JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/user_noti.js"></script>

</body>
</html>
