<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - H2O2U</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Clean Homepage Typography (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ice-bg: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            --ice-card: #ffffff;
            --ice-primary: #0284c7;
            --ice-primary-hover: #0369a1;
            --ice-light-accent: #f0f9ff;
            --ice-border: #e0f2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            background: var(--ice-bg);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
        }

        /* Landscape Card with Rounded Corners */
        .auth-card-landscape {
            background: var(--ice-card);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(2, 132, 199, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            max-width: 920px;
            width: 100%;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Left Decorative Ice Banner */
        .ice-banner {
            background: linear-gradient(160deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
            color: #ffffff;
            padding: 3.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ice-banner::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 220px;
            height: 220px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Nav Tab Switcher */
        .ice-tabs {
            background-color: var(--ice-light-accent);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--ice-border);
        }

        .ice-tabs .nav-link {
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 10px;
            padding: 0.65rem 1rem;
            transition: all 0.25s ease;
        }

        .ice-tabs .nav-link.active {
            background-color: #ffffff;
            color: var(--ice-primary);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.12);
        }

        /* Ice Input Controls */
        .form-label-ice {
            font-weight: 600;
            font-size: 0.825rem;
            color: var(--text-main);
            margin-bottom: 0.35rem;
        }

        .form-control-ice {
            border: 1.5px solid var(--ice-border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .form-control-ice:focus {
            background-color: #ffffff;
            border-color: var(--ice-primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
            outline: none;
        }

        .input-group-text-ice {
            background-color: #f8fafc;
            border: 1.5px solid var(--ice-border);
            border-right: none;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            color: var(--ice-primary);
        }

        .input-group .form-control-ice {
            /* border-left: 0; */
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }

        /* Action Buttons */
        .btn-ice {
            background-color: var(--ice-primary);
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            transition: all 0.25s ease;
        }

        .btn-ice:hover {
            background-color: var(--ice-primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.25);
        }

        .form-check-input:checked {
            background-color: var(--ice-primary);
            border-color: var(--ice-primary);
        }
    </style>
</head>

<body>

    <main class="container py-5 d-flex justify-content-center">
        <div class="auth-card-landscape row g-0">
            
            <!-- LEFT PANEL: Brand Hero Section -->
            <div class="col-lg-5 ice-banner d-none d-lg-flex">
                <div>
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <div class="bg-white text-primary rounded-circle p-2 d-inline-flex align-items-center justify-content-center" style="width: 44px; height: 44px;">
                            <i class="fa-solid fa-droplet fa-lg text-primary"></i>
                        </div>
                        <h3 class="m-0 fw-bold tracking-tight">H2O2U</h3>
                    </div>
                    <h2 class="fw-extrabold mb-3 display-6">Fresh Hydration, Standard Delivery.</h2>
                    <p class="text-white-50 m-0">Manage your subscription, change delivery schedules, and track orders in real time.</p>
                </div>
            </div>

            <!-- RIGHT PANEL: Form Section -->
            <div class="col-lg-7 p-4 p-md-5">
                
                <!-- Nav Tabs -->
                <ul class="nav ice-tabs nav-justified mb-4" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">Log In</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup-pane" type="button" role="tab">Sign Up</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabsContent">
                    
                    <!-- LOG IN PANE -->
                    <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                        <div class="mb-4">
                            <h4 class="fw-bold m-0">Welcome Back</h4>
                            <p class="text-muted small mt-1">Please enter your credentials to access your account.</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label-ice">Email or Phone Number</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-ice"><i class="fa-regular fa-envelope"></i></span>
                                    <input type="text" class="form-control form-control-ice" placeholder="Enter your email or phone" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label-ice">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text input-group-text-ice"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control form-control-ice" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-muted small" for="rememberMe">Keep me logged in</label>
                                </div>
                                <a href="#" class="small text-decoration-none fw-semibold" style="color: var(--ice-primary);">Forgot Password?</a>
                            </div>

                            <button type="submit" class="btn btn-ice w-100">LOG IN</button>
                        </form>
                    </div>

                    <!-- SIGN UP PANE -->
                    <div class="tab-pane fade" id="signup-pane" role="tabpanel">
                        <div class="mb-4">
                            <h4 class="fw-bold m-0">Create an Account</h4>
                            <p class="text-muted small mt-1">Start your water delivery plan with H2O2U.</p>
                        </div>

                        <form id="signupForm">
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label-ice">First Name</label>
                                    <input type="text" class="form-control form-control-ice" placeholder="First name" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label-ice">Last Name</label>
                                    <input type="text" class="form-control form-control-ice" placeholder="Last name" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label-ice">Phone Number</label>
                                <input type="tel" class="form-control form-control-ice" placeholder="09-xxxxxxxxx" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label-ice">Email Address</label>
                                <input type="email" class="form-control form-control-ice" placeholder="example@gmail.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label-ice">Password</label>
                                <div class="input-group">
                                <input type="password" class="form-control form-control-ice" placeholder="Create password" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label-ice">Confirm Password</label>
                                <div class="input-group">
                                <input type="password" class="form-control form-control-ice" placeholder="Confirm password" required>
                            </div>
                            </div>

                            <button type="submit" class="btn btn-ice w-100">CREATE ACCOUNT</button>
                        </form>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
