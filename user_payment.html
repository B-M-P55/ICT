<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Payment</title>


    <!-- =========================================
         Bootstrap CSS
    ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =========================================
         Custom CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="css/payment.css">

</head>


<body>


<!-- =========================================
     PAGE TITLE
========================================== -->

<div class="page-title">

    Payment

</div>



<!-- =========================================
     PAYMENT PAGE
========================================== -->

<div class="payment-page">


    <!-- =====================================
         PAYMENT CONTAINER
    ====================================== -->

    <div class="payment-container">


        <!-- =================================
             PAYMENT METHOD TITLE
        ================================== -->

        <div class="payment-title">

            Payment Method

        </div>



        <!-- =================================
             PAYMENT FORM
        ================================== -->

        <form id="paymentForm">


            <!-- =================================
                 ESTIMATED ARRIVAL TIME
            ================================== -->

            <div class="arrival-time">

                Estimated arrival time :

                <span>
                    30 minutes
                </span>

            </div>



            <!-- =================================
                 PAYMENT METHOD LABEL
            ================================== -->

            <div class="payment-label">

                Choose your payment method

            </div>



            <!-- =================================
                 PAYMENT METHOD SELECT
            ================================== -->

            <div class="payment-select-container">

                <select
                    id="paymentMethod"
                    class="payment-select">

                    <option value="">
                        Select one...
                    </option>

                    <option value="KBZ Pay">
                        KBZ Pay
                    </option>

                    <option value="Cash on Delivery">
                        Cash on Delivery
                    </option>

                </select>


                <span class="payment-select-arrow">
                    ▼
                </span>

            </div>



            <!-- =================================
                 PAYMENT PHOTO
            ================================== -->

            <div class="payment-photo-container">

                <input
                    type="file"
                    id="paymentPhoto"
                    accept="image/*"
                    hidden>


                <label
                    for="paymentPhoto"
                    class="payment-photo-label">

                    <span id="fileName">
                        Attach the photo of payment
                    </span>


                    <span class="required-star">
                        *
                    </span>

                </label>


                <!-- Three dots shown in screenshot -->

                <div class="payment-dots">
                    ...
                </div>

            </div>



            <!-- =================================
                 CONFIRM BUTTON
            ================================== -->

            <div class="confirm-area">

                <button
                    type="submit"
                    class="confirm-button">

                    Confirm

                </button>

            </div>



            <!-- =================================
                 MESSAGE
            ================================== -->

            <div
                id="paymentMessage"
                class="payment-message">
            </div>


        </form>

    </div>

</div>



<!-- =========================================
     Bootstrap JS
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- =========================================
     Custom JS
========================================== -->

<script src="js/payment.js"></script>


</body>

</html>
