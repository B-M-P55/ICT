<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - My Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/nav&footer.css">
    <link rel="stylesheet" href="css/user_pf.css">
</head>

<body>

    <!-- MAIN PROFILE PAGE -->
    <div class="profile-page">

        <!-- LEFT SIDEBAR -->
        <div class="sidebar">

            <!-- USER HEADER -->
            <div class="user-header">

                <!-- Water Logo -->
                <div class="water-logo">
                    <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30 3 C30 3 8 29 8 43 C8 57 18 66 30 66 C42 66 52 57 52 43 C52 29 30 3 30 3Z" fill="#179ED5"/>
                        <path d="M30 12 C30 12 15 32 15 43 C15 53 21 59 30 59 C39 59 45 53 45 43 C45 32 30 12 30 12Z" fill="white"/>
                        <path d="M30 20 C30 20 20 35 20 43 C20 49 24 53 30 53 C36 53 40 49 40 43 C40 35 30 20 30 20Z" fill="#179ED5"/>
                    </svg>
                </div>

                <!-- User text -->
                <div class="user-details">
                    <div class="user-name" id="displayHeaderName">User</div>
                    <button type="button" class="view-profile-btn" id="viewProfileBtn">View Profile</button>
                </div>
            </div>

            <!-- SIDEBAR MENU -->
            <div class="sidebar-menu">

                <!-- My Profile -->
                <button type="button" class="sidebar-item selected" id="profileBtn">
                    <span>My Profile</span>
                    <span class="right-arrow">▶</span>
                </button>

                <!-- Password -->
                <button type="button" class="sidebar-item" id="passwordBtn">
                    Password
                </button>

                <!-- Notifications -->
                <button type="button" class="sidebar-item" id="notiBtn">
                    Notifications
                </button>

                <!-- My Order -->
                <button type="button" class="sidebar-item" id="orderBtn">
                    My Order
                </button>

                <!-- Delivery History -->
                <button type="button" class="sidebar-item" id="historyBtn">
                    Delivery History
                </button>

                <!-- Back to Homepage -->
                <button type="button" class="back-button" id="backBtn">
                    Back
                </button>

            </div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content">

            <!-- Profile Form -->
            <div id="profileContent">
                <form id="profileForm">

                    <!-- USERNAME -->
                    <div class="form-row">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="profile-input" required>
                        <div class="username-note">
                            <span>*</span> Username must not include spaces or special characters (e.g. @, #, $)
                        </div>
                    </div>

                    <!-- DISPLAY NAME -->
                    <div class="form-row">
                        <label for="displayName">Display name</label>
                        <input type="text" id="displayName" class="profile-input">
                    </div>

                    <!-- TOWNSHIP / CITY -->
                    <div class="form-row">
                        <label for="township">Township / City</label>
                        <div class="select-box">
                            <select id="township" class="profile-input">
                                <option value=""></option>
                                <option value="Yangon">Yangon</option>
                                <option value="Insein">Insein</option>
                                <option value="Mayangone">Mayangone</option>
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                    </div>

                    <!-- PHONE -->
                    <div class="form-row">
                        <label for="phone">Phone number</label>
                        <input type="text" id="phone" class="profile-input">
                    </div>

                    <!-- EMAIL -->
                    <div class="form-row">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="profile-input">
                    </div>

                    <!-- SAVE BUTTON -->
                    <div class="save-area">
                        <button type="submit" class="save-button">Save</button>
                    </div>

                    <!-- MESSAGE -->
                    <div id="message" class="message"></div>
                </form>
            </div>

        </div>
    </div>

    <script src="js/user_pf.js"></script>
</body>
</html>
