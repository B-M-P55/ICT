<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/user_pw.css">
</head>

<body>
    <!-- MAIN PASSWORD PAGE -->
    <div class="profile-page">

        <!-- LEFT SIDEBAR -->
        <div class="sidebar">

            <!-- USER HEADER -->
            <div class="user-header">

                <!-- Water Logo -->
                <div class="water-logo">
                    <svg viewBox="0 0 60 70" xmlns="http://www.w3.org/2000/svg">
                        <path d="M30 3 C30 3 8 29 8 43 C8 57 18 66 30 66 C42 66 52 57 52 43 C52 29 30 3 30 3Z" fill="#179ED5"/>
                        <path d="M30 12 C30 12 15 32 15 43 C15 53 21 59 30 59 C39 59 45 53 45 43 C45 32 30 12 30 12Z" fill="white"/>
                        <path d="M30 20 C30 20 20 35 20 43 C20 49 24 53 30 53 C36 53 40 49 40 43 C40 35 30 20 30 20Z" fill="#179ED5"/>
                    </svg>
                </div>

                <!-- User text -->
                <div class="user-details">
                    <div class="user-name" id="displayHeaderName">User</div>
                    <button type="button" class="view-profile-btn" id="viewProfileBtn">View Profile</button>
                </div>
            </div>

            <!-- SIDEBAR MENU -->
            <div class="sidebar-menu">

                <!-- My Profile -->
                <button type="button" class="sidebar-item" id="profileBtn">
                    My Profile
                </button>

                <!-- Password -->
                <button type="button" class="sidebar-item selected" id="passwordBtn">
                    <span>Password</span>
                    <span class="right-arrow">▶</span>
                </button>

                <!-- Notifications -->
                <button type="button" class="sidebar-item" id="notiBtn">
                    Notifications
                </button>

                <!-- My Order -->
                <button type="button" class="sidebar-item" id="orderBtn">
                    My Order
                </button>

                <!-- Delivery History -->
                <button type="button" class="sidebar-item" id="historyBtn">
                    Delivery History
                </button>

                <!-- Back to Homepage -->
                <button type="button" class="back-button" id="backBtn">
                    Back
                </button>

            </div>
        </div>

        <!-- RIGHT CONTENT -->
        <div class="content">

            <!-- PASSWORD CONTENT -->
            <div id="passwordContent" class="password-content">
                <div class="password-card">

                    <!-- TITLE -->
                    <h2 class="password-title">Change Password</h2>

                    <!-- FORM -->
                    <form id="passwordForm">

                        <!-- CURRENT PASSWORD -->
                        <div class="password-row">
                            <label for="currentPassword">CURRENT PASSWORD</label>
                            <input type="password" id="currentPassword" class="password-input" required>
                        </div>

                        <!-- NEW PASSWORD -->
                        <div class="password-row">
                            <label for="newPassword">NEW PASSWORD</label>
                            <input type="password" id="newPassword" class="password-input" required>
                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="password-row">
                            <label for="confirmPassword">CONFIRM PASSWORD</label>
                            <input type="password" id="confirmPassword" class="password-input" required>
                        </div>

                        <!-- SAVE -->
                        <div class="password-save-area">
                            <button type="submit" class="password-save-button">SAVE CHANGES</button>
                        </div>

                        <!-- NOTE -->
                        <div class="password-note">
                            YOU WILL BE ASKED TO LOG IN AGAIN WITH YOUR NEW PASSWORD AFTER YOU SAVE YOUR CHANGES.
                        </div>

                        <!-- MESSAGE -->
                        <div id="passwordMessage" class="message"></div>

                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/user_pw.js"></script>
</body>

</html>
